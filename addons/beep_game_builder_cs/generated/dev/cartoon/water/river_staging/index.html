<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartoon river current</title>
<style>*{box-sizing:border-box}body{margin:0;background:#18231f;color:#eff4f0;font:14px system-ui}header{padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #526557}h1{font-size:18px;margin:0 auto 0 0}button{width:36px;height:36px;background:#2e4436;color:white;border:1px solid #738778;border-radius:4px;cursor:pointer}main{max-width:960px;margin:auto}canvas{display:block;width:100%;height:auto}#modules{max-width:512px;margin:24px auto}output{width:85px}footer{padding:16px}a{color:#bbdec6}</style>
<header><h1>Cartoon River Current</h1><button id="play" title="Pause" aria-label="Pause">&#10074;&#10074;</button><output id="frame"></output><a href="../staging/index.html">Lake</a></header>
<main><canvas id="map" width="640" height="576"></canvas><canvas id="modules" width="256" height="192"></canvas><p id="error"></p></main>
<footer><a href="runtime/river_current_16frames.png">Atlas PNG</a> | <a href="godot/river_current.tres">Godot TileSet</a> | <a href="manifest.json">Manifest</a></footer>
<script src="preview-data.js"></script><script>
const ctx=document.getElementById('map').getContext('2d'),modules=document.getElementById('modules').getContext('2d');let frame=0,playing=true,last=0,elapsed=0;
async function load(src){const i=new Image();i.src=src;await i.decode();return i}
async function boot(){const atlas=await load(DATA.atlas),grass=await load(DATA.grass),ids=new Map(DATA.manifest.profiles.map(p=>[p.id,p.atlas]));
function draw(){for(let y=0;y<9;y++)for(let x=0;x<10;x++)ctx.drawImage(grass,x*64,y*64);for(const p of DATA.manifest.map){const [x,y]=ids.get(p.profile);ctx.drawImage(atlas,x*64,(y+frame*3)*64,64,64,p.x*64,p.y*64,64,64)}modules.drawImage(atlas,0,frame*192,256,192,0,0,256,192);document.getElementById('frame').value=(frame+1)+' / 16';}
document.getElementById('play').onclick=()=>{playing=!playing;const b=document.getElementById('play');b.innerHTML=playing?'&#10074;&#10074;':'&#9654;';b.title=b.ariaLabel=playing?'Pause':'Play'};
window.riverReview={ready:true,show(k){playing=false;frame=k%16;draw()},frame:()=>frame};
function tick(t){if(last&&playing){elapsed+=Math.min(t-last,100);frame=Math.floor(elapsed/75)%16}last=t;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick)}boot().catch(e=>document.getElementById('error').textContent=e.message);
</script></html>
