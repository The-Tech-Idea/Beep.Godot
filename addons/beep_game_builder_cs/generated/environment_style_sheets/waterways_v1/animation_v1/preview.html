<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Animation Preview</title><style>body{margin:24px;background:#f2f4f1;color:#1d2925;font:16px system-ui;letter-spacing:0}main{max-width:1200px;margin:auto}h1{font-size:26px}h2{font-size:20px}.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;border-top:1px solid #bbc6bc;padding:16px 0}figure{margin:0}canvas{display:block;width:100%;aspect-ratio:360/320;background:#00ff00;object-fit:contain}figcaption{padding:8px 0}button,input{font:inherit}button{width:42px;height:36px}label{margin-left:16px}p{line-height:1.5}@media(max-width:650px){.row{grid-template-columns:1fr}}</style><main><h1>Water Animation Preview</h1><button id="play" title="Pause" aria-label="Pause">&#10074;&#10074;</button><label>FPS <input id="fps" type="number" min="1" max="24" value="8"></label><p id="status">Loading sheets...</p><div id="sheets"></div><p>Green source background retained. Generated loops may need alignment and transition cleanup before production.</p></main><script>
const definitions=[{"name":"river_flow","fps":8,"frames":[[64,52,278,278],[440,52,278,278],[816,52,278,278],[1192,52,278,278]]},{"name":"waterfall_flow","fps":8,"frames":[[24,380,360,320],[400,380,360,320],[776,380,360,320],[1152,380,360,320]]},{"name":"splash","fps":8,"frames":[[24,740,360,220],[400,740,360,220],[776,740,360,220],[1152,740,360,220]]}],names=["cartoon_water_animation","pixel_water_animation"];let playing=true,elapsed=0,last=performance.now();const views=[];
Promise.all(names.map(name=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve({name,im});im.onerror=()=>reject(new Error('Cannot load '+name));im.src=name+'.png';}))).then(sheets=>{for(const {name,im} of sheets){const h=document.createElement('h2');h.textContent=name.startsWith('pixel')?'Pixel art':'Cartoon';document.getElementById('sheets').append(h);const row=document.createElement('div');row.className='row';for(const a of definitions){const fig=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption');c.width=360;c.height=320;cap.textContent=a.name;fig.append(c,cap);row.append(fig);const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=!name.startsWith('pixel');views.push({im,a,ctx});}document.getElementById('sheets').append(row);}document.getElementById('status').textContent='Four frames per animation';}).catch(e=>document.getElementById('status').textContent=e.message);
document.getElementById('play').onclick=()=>{playing=!playing;const b=document.getElementById('play');b.innerHTML=playing?'&#10074;&#10074;':'&#9654;';b.title=playing?'Pause':'Play';b.setAttribute('aria-label',b.title);};
function tick(t){if(playing)elapsed+=Math.min(t-last,100);last=t;const fps=Math.max(1,Math.min(24,Number(document.getElementById('fps').value)||8)),f=Math.floor(elapsed*fps/1000)%4;for(const {im,a,ctx} of views){const [x,y,w,h]=a.frames[f];ctx.fillStyle='#00ff00';ctx.fillRect(0,0,360,320);ctx.drawImage(im,x,y,w,h,(360-w)/2,(320-h)/2,w,h);}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
